[project]
name = "hiwindows-software-manager"
version = "0.1.0"
description = "Software management package for HiWindows."
requires-python = ">=3.14"
dependencies = [
    "hiwindows-core",
    "hiwindows-io",
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/software_manager"]
