[project]
name = "hiwindows-hook"
version = "0.1.0"
description = "pywebview hook for the HiWindows frontend."
requires-python = ">=3.14"
dependencies = [
    "pywebview>=5.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hook"]
